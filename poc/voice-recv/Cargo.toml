[package]
name = "voice-recv-poc"
version = "0.1.0"
edition = "2024"
publish = false

# PoC 1: 음성 채널에서 사람별 PCM이 오는지(DAVE 복호화 포함) 통계만 낸다. 음성은 저장하지 않는다.
# 버전은 musicbot-mk2 Cargo.lock과 맞춘다(serenity 0.12.5, songbird 0.6.0, davey 0.1.3).
[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "voice"] }
songbird = { version = "0.6.0", features = ["receive"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
