<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 아짱: 코덱스 아스트라 모에화. 흑발 단발 + 민트 포인트, 시크한 반쯤 뜬 눈 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#EEF7F5"/>
      <stop offset="1" stop-color="#CFE5E1"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F47"/>
      <stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3B38"/>
      <stop offset="0.55" stop-color="#1F8A80"/>
      <stop offset="1" stop-color="#7FE0CF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 배경 반짝이 -->
  <g fill="#7FCFC2" opacity="0.45">
    <path d="M70 110 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M440 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M430 390 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- 뒷머리 -->
  <path d="M118 250 C108 140 180 70 256 70 C332 70 404 140 394 250 C398 300 400 350 392 392 L120 392 C112 350 114 300 118 250 Z" fill="url(#hair)"/>

  <!-- 어깨·옷 -->
  <path d="M120 512 C130 450 180 420 256 420 C332 420 382 450 392 512 Z" fill="#F7EFE6"/>
  <path d="M200 428 L256 476 L312 428 C295 422 276 420 256 420 C236 420 217 422 200 428 Z" fill="#1F8A80"/>
  <path d="M232 448 L256 470 L280 448 L256 500 Z" fill="#145E57"/>
  <!-- 목 -->
  <path d="M226 380 L226 425 C240 440 272 440 286 425 L286 380 Z" fill="#F7CDB8"/>

  <!-- 얼굴 -->
  <ellipse cx="256" cy="285" rx="128" ry="122" fill="#FFE6D8"/>

  <!-- 옆머리 -->
  <path d="M130 220 C118 290 120 350 136 398 C156 370 166 320 170 260 Z" fill="url(#hair)"/>
  <path d="M382 220 C394 290 392 350 376 398 C356 370 346 320 342 260 Z" fill="url(#hair)"/>

  <!-- 앞머리 -->
  <path d="M128 244 C130 150 190 100 256 100 C322 100 382 150 384 244
           C372 226 364 214 352 206 C350 224 348 238 344 252
           C334 228 322 210 306 200 C304 218 300 232 292 246
           C282 222 270 204 256 194 C246 210 240 228 236 244
           C228 224 218 208 206 200 C196 214 190 232 186 252
           C178 232 170 218 160 208 C150 220 140 232 128 244 Z" fill="url(#hair)"/>
  <!-- 머리 하이라이트 -->
  <path d="M190 140 C215 125 245 120 270 124" stroke="#7C8794" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.8"/>
  

  <!-- 머리핀: 민트 육각 핀 두 개 -->
  <g transform="translate(340 170) rotate(-15)">
    <rect x="-34" y="-7" width="68" height="14" rx="7" fill="#7FE0CF" stroke="#145E57" stroke-width="3"/>
    <path d="M-20 -14 L-8 -14 L-2 -4 L-8 6 L-20 6 L-26 -4 Z" transform="translate(0 4)" fill="#EEF7F5" stroke="#145E57" stroke-width="3"/>
  </g>

  <!-- 눈썹 -->
  <path d="M178 238 Q204 228 228 236" stroke="#2A2F36" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M284 236 Q308 228 334 238" stroke="#2A2F36" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 왼눈 -->
  <g>
    <ellipse cx="204" cy="290" rx="30" ry="38" fill="#FFFFFF"/>
    <ellipse cx="204" cy="294" rx="25" ry="33" fill="url(#iris)"/>
    <ellipse cx="204" cy="296" rx="11" ry="15" fill="#101418"/>
    <circle cx="194" cy="288" r="8" fill="#FFFFFF"/>
    <circle cx="214" cy="310" r="4" fill="#FFFFFF" opacity="0.9"/>
    <path d="M168 262 L240 262 L240 276 Q204 266 168 280 Z" fill="#FFE6D8"/><path d="M168 280 Q204 266 240 276" stroke="#101418" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M168 280 L160 274" stroke="#101418" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 오른눈 -->
  <g>
    <ellipse cx="308" cy="290" rx="30" ry="38" fill="#FFFFFF"/>
    <ellipse cx="308" cy="294" rx="25" ry="33" fill="url(#iris)"/>
    <ellipse cx="308" cy="296" rx="11" ry="15" fill="#101418"/>
    <circle cx="298" cy="288" r="8" fill="#FFFFFF"/>
    <circle cx="318" cy="310" r="4" fill="#FFFFFF" opacity="0.9"/>
    <path d="M272 262 L344 262 L344 280 Q308 266 272 276 Z" fill="#FFE6D8"/><path d="M272 276 Q308 266 344 280" stroke="#101418" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M344 280 L352 274" stroke="#101418" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 볼터치 -->
  <ellipse cx="170" cy="340" rx="22" ry="11" fill="#FF8F7A" opacity="0.3"/>
  <ellipse cx="342" cy="340" rx="22" ry="11" fill="#FF8F7A" opacity="0.45"/>
  <g stroke="#FF8F7A" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M160 338 l6 -6"/><path d="M170 338 l6 -6"/><path d="M180 338 l6 -6"/>
    <path d="M332 338 l6 -6"/><path d="M342 338 l6 -6"/><path d="M352 338 l6 -6"/>
  </g>

  <!-- 입 (ω) -->
  <path d="M240 356 Q258 364 276 350" stroke="#5A3A34" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
